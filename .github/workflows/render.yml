name: Render Reel

on:
  workflow_dispatch:
    inputs:
      frame:
        description: 'Optional: render a single still frame instead of the full MP4'
        required: false
        default: ''

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Ensure headless browser
        run: npx remotion browser ensure

      - name: Render
        if: inputs.frame == ''
        run: npm run render

      - name: Render single still
        if: inputs.frame != ''
        run: npx remotion still src/index.ts WPExpertReel out/still.png --frame=${{ inputs.frame }}

      - uses: actions/upload-artifact@v4
        with:
          name: wp-expert-reel
          path: out/
          if-no-files-found: error
          retention-days: 14
